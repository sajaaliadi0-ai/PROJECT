<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real Estate Project</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Header */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        nav a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Hero Section */
        .hero {
            background: url('https://images.unsplash.com/photo-1568605114967-8130f3a36994') no-repeat center center/cover;
            height: 300px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h2 {
            font-size: 36px;
            background-color: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 8px;
        }

        /* Properties Section */
        .properties {
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card-content h3 {
            margin: 0 0 10px;
        }

        .price {
            color: #27ae60;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>Real Estate</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Properties</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>Find Your Dream Home</h2>
</section>

<section class="properties">
    <div class="card">
        <img src="https://images.unsplash.com/photo-1572120360610-d971b9d7767c">
        <div class="card-content">
            <h3>Modern Apartment</h3>
            <p>Amman - Abdoun</p>
            <p class="price">$120,000</p>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c">
        <div class="card-content">
            <h3>Luxury Villa</h3>
            <p>Amman - Dabouq</p>
            <p class="price">$350,000</p>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1599423300746-b62533397364">
        <div class="card-content">
            <h3>Family House</h3>
            <p>Zarqa</p>
            <p class="price">$90,000</p>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 Real Estate Project | All Rights Reserved</p>
</footer>

</body>
</html>
