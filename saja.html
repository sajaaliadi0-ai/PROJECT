<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>أنواع الورود</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff0f5;
            direction: rtl;
            text-align: center;
        }
        h1 {
            color: #c2185b;
        }
        .flower {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 10px;
            width: 250px;
            margin: 15px;
            padding: 15px;
            display: inline-block;
        }
        .flower h2 {
            color: #8e24aa;
        }
    </style>
</head>
<body>

    <h1>أنواع الورود</h1>

    <div class="flower">
        <h2>الورد الجوري</h2>
        <p>من أشهر أنواع الورود، يرمز إلى الحب والرومانسية.</p>
    </div>

    <div class="flower">
        <h2>زهرة التوليب</h2>
        <p>زهرة جميلة بألوان متعددة، ترمز إلى الأناقة.</p>
    </div>

    <div class="flower">
        <h2>زهرة الأقحوان</h2>
        <p>تستخدم كثيرًا في الزينة وتتميز بعمرها الطويل.</p>
    </div>

    <div class="flower">
        <h2>زهرة الياسمين</h2>
        <p>تتميز برائحتها العطرة ولونها الأبيض.</p>
    </div>

</body>
</html>
